name: hods
description: HODS 
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  supabase_flutter: ^2.9.1
  image: ^4.3.0
  google_generative_ai: ^0.4.7
  
  

  # State Management
  flutter_riverpod: ^2.6.1
  

  # Navigation
  go_router: ^17.3.0

  

  # UI & UX
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.1
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/hodas_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
